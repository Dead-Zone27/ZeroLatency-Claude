<!-- @dsCard group="Overlays" height=480 width=1000 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Menu — ZeroLatency DS</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--text)}</style></head>
<body class="zl" style="padding:24px">
<div style="display:flex;gap:24px;align-items:flex-start">
<div class="zl-menu" role="dialog" aria-label="Filter">
  <input class="zl-input zl-menu-search is-focus" placeholder="Filter by…" aria-label="Filter by">
  <div class="zl-menu-label">Applied</div>
  <button class="zl-menu-item"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2.5-7h11L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13h4.5l1 2h5l1-2H20"/></svg>Mailbox<span class="zl-menu-item-hint">does not contain “Spam, Trash”</span></button>
  <button class="zl-menu-item"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M15.5 12v1.5a2.5 2.5 0 0 0 5 0V12a8.5 8.5 0 1 0-3.3 6.7"/></svg>From<span class="zl-menu-item-hint">contains “priya@…”<svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></button>
  <button class="zl-menu-item"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5V5a1 1 0 0 1 1-1h7.5L20 11.5 12.5 19z"/><circle cx="8.5" cy="8.5" r="1.2"/></svg>Promotions<span class="zl-menu-item-muted">(Gmail)</span><span class="zl-menu-item-hint">is not<svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></button>
  <div class="zl-menu-sep"></div>
  <button class="zl-menu-item"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5"/><circle cx="17.5" cy="6.5" r="2.5" fill="currentColor" stroke="none"/></svg>Unread</button>
  <button class="zl-menu-item is-hover"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>Read</button>
  <button class="zl-menu-item"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 8.5 10 15a2 2 0 0 1-2.8-2.8L14 5.4a3.5 3.5 0 0 1 5 5L12 17.5a5 5 0 0 1-7-7L11.5 4"/></svg>Attachment</button>
  <button class="zl-menu-item"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v3M15.5 3.5v3"/></svg>Calendar event</button>
  <button class="zl-menu-item"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5V5a1 1 0 0 1 1-1h7.5L20 11.5 12.5 19z"/><circle cx="8.5" cy="8.5" r="1.2"/></svg>Label</button>
  <button class="zl-menu-item"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="10" r="2.8"/><path d="M7 17.5c1-2 2.8-3 5-3s4 1 5 3"/></svg>To</button>
  <button class="zl-menu-item"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 8.5 6 13 18M5.8 14.5h5.4M15.5 12.5c.6-.7 1.4-1 2.3-1 1.4 0 2.2.8 2.2 2.2V18M20 15c-2.8 0-4.5.5-4.5 1.7 0 .9.7 1.4 1.7 1.4 1.5 0 2.8-1.1 2.8-2.6"/></svg>Subject</button>
  <button class="zl-menu-item"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v3M15.5 3.5v3"/></svg>Date</button>
</div>
<div class="zl-menu" role="dialog" aria-label="Group by">
  <div class="zl-menu-title">Group by</div>
  <input class="zl-input zl-menu-search" placeholder="Search grouping options…" aria-label="Search grouping options">
  <button class="zl-menu-item zl-menu-item--2line is-hover"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v3M15.5 3.5v3"/></svg><span class="zl-menu-item-text">Date<small>Group by date</small></span><svg class="zl-icon zl-menu-item-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  <button class="zl-menu-item zl-menu-item--2line"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5l2.3 4.8 5.2.7-3.8 3.6.9 5.2L12 16.4l-4.6 2.4.9-5.2-3.8-3.6 5.2-.7z"/></svg><span class="zl-menu-item-text">Starred<small>Group by starred emails</small></span></button>
  <button class="zl-menu-item zl-menu-item--2line"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.5M12 15.5v.01"/></svg><span class="zl-menu-item-text">Important<small>Group by Gmail’s Important label</small></span></button>
  <button class="zl-menu-item zl-menu-item--2line"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M15.5 12v1.5a2.5 2.5 0 0 0 5 0V12a8.5 8.5 0 1 0-3.3 6.7"/></svg><span class="zl-menu-item-text">Email or domain<small>Group by people and companies</small></span><span class="zl-menu-item-hint"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></button>
  <button class="zl-menu-item zl-menu-item--2line"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v2.5M12 17.5V20M4 12h2.5M17.5 12H20M6.3 6.3l1.8 1.8M15.9 15.9l1.8 1.8M6.3 17.7l1.8-1.8M15.9 8.1l1.8-1.8"/></svg><span class="zl-menu-item-text">Priority<small>Group by the Priority property</small></span><span class="zl-menu-item-hint"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></button>
  <button class="zl-menu-item zl-menu-item--2line"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5"/><circle cx="17.5" cy="6.5" r="2.5" fill="currentColor" stroke="none"/></svg><span class="zl-menu-item-text">Unread<small>Split into unread and read</small></span></button>
</div>
<div class="zl-menu" style="width:240px" role="menu" aria-label="New view">
  <div class="zl-menu-label">New view</div>
  <button class="zl-menu-item" role="menuitem"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 15 9M14 5v2M18 9h2M17 6l1.5-1.5M18.5 13.5 17 12M10 6 8.5 4.5"/></svg>Create from an auto label</button>
  <button class="zl-menu-item is-hover" role="menuitem"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>Configure manually</button>
  <button class="zl-menu-item" role="menuitem"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.4"/></svg>Use template</button>
  <div class="zl-menu-label">Suggested views</div>
  <button class="zl-menu-item" role="menuitem"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="3.2"/><path d="M5.5 19c1.2-3 3.6-4.5 6.5-4.5s5.3 1.5 6.5 4.5"/></svg><span>From <span style="color:var(--text-subtle)">is</span> Ops Weekly</span></button>
  <button class="zl-menu-item" role="menuitem"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M15.5 12v1.5a2.5 2.5 0 0 0 5 0V12a8.5 8.5 0 1 0-3.3 6.7"/></svg><span>Domain <span style="color:var(--text-subtle)">is</span> northwind.io</span></button>
</div></div>
</body>
</html>
