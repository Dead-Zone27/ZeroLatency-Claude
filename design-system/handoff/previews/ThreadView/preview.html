<head><meta charset="utf-8"><title>ThreadView — ZeroLatency DS</title>

<body class="zl" style="padding:24px">
<section class="zl-peek" style="height:460px" aria-label="Open thread">
  <div class="zl-peek-bar"><button class="zl-btn zl-btn--icon " aria-label="Close peek"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7l5 5-5 5M5 7l5 5-5 5"/></svg></button><button class="zl-btn zl-btn--icon " aria-label="Previous thread"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14l5-5 5 5"/></svg></button><button class="zl-btn zl-btn--icon " aria-label="Next thread"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button><button class="zl-btn zl-btn--secondary"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 15 9M14 5v2M18 9h2M17 6l1.5-1.5M18.5 13.5 17 12M10 6 8.5 4.5"/></svg>Auto label similar</button><button class="zl-btn zl-btn--icon " aria-label="Remind me"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path d="M12 8v4l2.5 1.5"/></svg></button><button class="zl-btn zl-btn--icon " aria-label="Mark as unread"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5"/><circle cx="17.5" cy="6.5" r="2.5" fill="currentColor" stroke="none"/></svg></button><button class="zl-btn zl-btn--icon " aria-label="Label"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5V5a1 1 0 0 1 1-1h7.5L20 11.5 12.5 19z"/><circle cx="8.5" cy="8.5" r="1.2"/></svg></button><button class="zl-btn zl-btn--icon " aria-label="Archive"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="4" rx="1"/><path d="M5.5 9v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9M10 13h4"/></svg></button><button class="zl-btn zl-btn--icon " aria-label="Trash"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button><button class="zl-btn zl-btn--icon " aria-label="More"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h.01M12 12h.01M18 12h.01   <div class="zl-peek-body">
    <h2 class="zl-thread-title">Term sheet redlines</h2>

    <div class="zl-message-head"><strong>Priya Raman</strong><time>Mar 22</time><small>To alex@northwind.io</small></div>
    <div class="zl-message-body"><p>Hi Alex,</p><p>Two open points on the option pool before we can sign. I’ve marked both in the doc and suggested wording for the vesting clause.</p><p>Could you look before Thursday’s call?</p></div>
  </div>
</section>

</html>
