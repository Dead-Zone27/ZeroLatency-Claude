<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — ZeroLatency DS</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--text)}</style></head>
<body class="zl" style="padding:24px">
<p class="zl-label-txt" style="margin:0 0 8px">Variants · md</p>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px"><button class="zl-btn zl-btn--primary">Join waitlist</button><button class="zl-btn zl-btn--secondary">See how it works</button><button class="zl-btn zl-btn--ghost">Skip</button><button class="zl-btn zl-btn--destructive">Delete rule</button><button class="zl-btn zl-btn--link">Read the docs</button></div>
<p class="zl-label-txt" style="margin:0 0 8px">Sizes · sm / md / lg · icon-only</p>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px"><button class="zl-btn zl-btn--primary zl-btn--sm">Send</button><button class="zl-btn zl-btn--primary">Send</button><button class="zl-btn zl-btn--primary zl-btn--lg">Send</button><button class="zl-btn zl-btn--secondary zl-btn--icon zl-btn--sm" aria-label="Archive"><svg class="zl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M3 4h18v3H3zM10 11h4"/></svg></button><button class="zl-btn zl-btn--secondary zl-btn--icon" aria-label="Snooze"><svg class="zl-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></button><button class="zl-btn zl-btn--ghost zl-btn--icon zl-btn--lg" aria-label="More"><svg class="zl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h.01M12 12h.01M18 12h.01"/></svg></button><button class="zl-btn zl-btn--primary">Continue <svg class="zl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
<p class="zl-label-txt" style="margin:0 0 8px">States (primary · secondary): default · hover · focus-visible · active · disabled · loading</p>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px"><button class="zl-btn zl-btn--primary">Default</button><button class="zl-btn zl-btn--primary is-hover">Hover</button><button class="zl-btn zl-btn--primary is-focus">Focus</button><button class="zl-btn zl-btn--primary is-active">Active</button><button class="zl-btn zl-btn--primary" disabled>Disabled</button><button class="zl-btn zl-btn--primary" aria-busy="true"><span class="zl-spinner" aria-hidden="true"></span>Sending…</button></div>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px"><button class="zl-btn zl-btn--secondary">Default</button><button class="zl-btn zl-btn--secondary is-hover">Hover</button><button class="zl-btn zl-btn--secondary is-focus">Focus</button><button class="zl-btn zl-btn--secondary is-active">Active</button><button class="zl-btn zl-btn--secondary" disabled>Disabled</button><button class="zl-btn zl-btn--destructive is-hover">Destructive hover</button><button class="zl-btn zl-btn--ghost is-hover">Ghost hover</button></div>
</body>
</html>
