<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TemplateCard — ZeroLatency DS</title>

<div class="zl-templates">
  <button class="zl-template"><span class="zl-template-art" style="background:var(--tag-green-bg)"><span style="display:flex"><svg class="zl-glyph zl-ink-green " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.9L22 9.7l-5.3 4.8L18.2 22 12 18.3 5.8 22l1.5-7.5L2 9.7l7.1-.8z"/></svg></span><span><span class="zl-tag"><span>Northwind</span></span></span><span class="zl-bar"></span></span><span class="zl-template-meta"><svg class="zl-glyph zl-ink-green " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.9L22 9.7l-5.3 4.8L18.2 22 12 18.3 5.8 22l1.5-7.5L2 9.7l7.1-.8z"/></svg><strong>Sales</strong><small>Prioritise sales-related email</small></span></button>
  <button class="zl-template"><span class="zl-template-art" style="background:var(--tag-pink-bg)"><span style="display:flex"><svg class="zl-glyph zl-ink-pink " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z"/></svg></span><span><span class="zl-tag zl-tag--orange"><span>Pending</span></span></span><span><span class="zl-tag zl-tag--purple"><span>Resolved</span></span></span><span class="zl-bar"></span></span><span class="zl-template-meta"><svg class="zl-glyph zl-ink-pink " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z"/></svg><strong>Support</strong><small>Manage customer feedback</small></span></button>
  <button class="zl-template"><span class="zl-template-art" style="background:var(--tag-orange-bg)"><span style="display:flex"><svg class="zl-glyph zl-ink-orange " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zm-2 7v10h14V9z"/></svg></span><span class="zl-bar"></span><span class="zl-bar"></span></span><span class="zl-template-meta"><svg class="zl-glyph zl-ink-orange " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zm-2 7v10h14V9z"/></svg><strong>Calendar</strong><small>All your events and meetings</small></span></button>
  <button class="zl-template"><span class="zl-template-art" style="background:var(--tag-red-bg)"><span style="display:flex"><svg class="zl-glyph zl-ink-red " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h3v3H4zm5 0h11v3H9zM4 10.5h3v3H4zm5 0h11v3H9zM4 16h3v3H4zm5 0h11v3H9z"/></svg></span><span><span class="zl-tag zl-tag--orange"><span>Important</span></span></span><span><span class="zl-tag zl-tag--purple"><span>To-do</span></span></span><span class="zl-bar"></span></span><span class="zl-template-meta"><svg class="zl-glyph zl-ink-red " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h3v3H4zm5 0h11v3H9zM4 10.5h3v3H4zm5 0h11v3H9zM4 16h3v3H4zm5 0h11v3H9z"/></svg><strong>Priority</strong><small>Organise email by priority</small></span></button>
