<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZeroLatency DS</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--accent); }
  .tint { fill:var(--accent-border); }
  .ink { fill:var(--surface-inverse); }
  .blk { rx:var(--radius-lg); }
  .on-accent, .on-ink { fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .on-accent { stroke:var(--accent-fg); }
  .big { stroke-width:12px; }
  .on-ink { stroke:var(--accent); stroke-width:6px; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:64px; line-height:.95; font-weight:600; letter-spacing:-.035em; color:var(--text); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--text-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent slab 144x280 bled off the top (the one brand hue, largest) · accent-border tint 112x136 · surface-inverse ink 192x216 bleeding off the right edge — about 30% of 960x288
  arrangement one tall slab with two satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     literal motif row: the mark's zero-with-tail — one large on the slab in accent-fg, three on the ink block with tails lengthening (speed) in accent; chosen because the mark itself is the brand's only shape
  scales      sides in space-4 multiples, gutters space-4, motif pitch space-12, stroke space-3 / space-1.5, corners radius-lg
-->
<rect class="brand blk" x="16" y="-16" width="144" height="280" rx="12"/>
<rect class="tint blk" x="176" y="128" width="112" height="136" rx="12"/>
<rect class="ink blk" x="304" y="48" width="192" height="216" rx="12"/>
<path class="on-accent big" d="M80 92A40 40 0 1 0 120 132M80 92H136"/><path class="on-ink" d="M344 88A12 12 0 1 0 356 100M344 88H384"/><path class="on-ink" d="M344 136A12 12 0 1 0 356 148M344 136H424"/><path class="on-ink" d="M344 184A12 12 0 1 0 356 196M344 184H472"/>
</svg>
</div>
<div class="words">
<h1 class="name">ZeroLatency<br>DS</h1>
<p class="tag">Calm by default, fast by design.</p>
</div>
</div>
</body>
</html>
