<!-- @dsCard group="Panels" height=360 width=860 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PropertyEditor — ZeroLatency DS</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--text)}</style></head>
<body class="zl" style="padding:24px">
<div style="display:flex;gap:24px;align-items:flex-start">
<div class="zl-menu" style="width:300px" role="dialog" aria-label="Status">
  <div class="zl-menu-title"><span class="zl-status zl-status--todo"><svg class="zl-status-dot" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6"/></svg>Not started</span></div>
  <div class="zl-menu-label">Select an option</div>
  <button class="zl-menu-item"><span class="zl-status zl-status--todo"><svg class="zl-status-dot" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6"/></svg>Not started</span><span class="zl-menu-item-hint zl-caps">Default</span></button>
  <button class="zl-menu-item"><span class="zl-status zl-status--canceled"><svg class="zl-status-dot" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M4.9 4.9l4.2 4.2M9.1 4.9 4.9 9.1" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>Canceled</span></button>
  <button class="zl-menu-item is-hover"><span class="zl-status zl-status--done"><svg class="zl-status-dot" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M4.3 7.2 6.2 9l3.6-3.8" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Done</span></button>
  <button class="zl-menu-item"><span class="zl-status zl-status--progress"><svg class="zl-status-dot" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M5.6 4.4 9.6 7l-4 2.6z" fill="#fff"/></svg>In progress</span></button>
  <div class="zl-menu-sep"></div>
  <button class="zl-menu-item"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>Edit property</button>
</div>
<aside class="zl-panel" style="height:340px" aria-label="Edit property">
  <div class="zl-panel-head"><button class="zl-btn zl-btn--icon " aria-label="Back"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><h3>Edit property</h3><button class="zl-btn zl-btn--icon " aria-label="Close"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div>
  <input class="zl-input zl-input--lg" value="Status" aria-label="Property name">
  <div class="zl-panel-label" style="margin-top:8px">Options<button class="zl-btn zl-btn--icon zl-btn--sm" aria-label="Add option"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <button class="zl-panel-row zl-panel-row--prop"><span class="zl-status zl-status--canceled"><svg class="zl-status-dot" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M4.9 4.9l4.2 4.2M9.1 4.9 4.9 9.1" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>Canceled</span><span class="zl-panel-row-end"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></button>
  <button class="zl-panel-row zl-panel-row--prop"><span class="zl-status zl-status--done"><svg class="zl-status-dot" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M4.3 7.2 6.2 9l3.6-3.8" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Done</span><span class="zl-panel-row-end"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></button>
  <button class="zl-panel-row zl-panel-row--prop"><span class="zl-status zl-status--progress"><svg class="zl-status-dot" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M5.6 4.4 9.6 7l-4 2.6z" fill="#fff"/></svg>In progress</span><span class="zl-panel-row-end"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></button>
  <button class="zl-panel-row zl-panel-row--prop"><span class="zl-status zl-status--todo"><svg class="zl-status-dot" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6"/></svg>Not started</span><span class="zl-panel-row-end"><span class="zl-caps">Default</span><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></button>
  <div class="zl-menu-sep" style="margin:8px 0"></div>
  <button class="zl-panel-row zl-panel-row--prop"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M9.9 6.3A9 9 0 0 1 12 6c5.8 0 9 6 9 6a15 15 0 0 1-2.6 3.3M6.4 7.8A15 15 0 0 0 3 12s3.2 6 9 6a8.6 8.6 0 0 0 3.6-.8"/></svg><span class="zl-panel-row-text">Hide property from Needs you</span></button>
  <button class="zl-panel-row zl-panel-row--prop"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg><span class="zl-panel-row-text">Delete property from Needs you</span></button>
</aside></div>
</body>
</html>
