<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Status — ZeroLatency DS</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--text)}</style></head>
<body class="zl" style="padding:24px">
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px"><span class="zl-status zl-status--todo"><svg class="zl-status-dot" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6"/></svg>Not started</span><span class="zl-status zl-status--progress"><svg class="zl-status-dot" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M5.6 4.4 9.6 7l-4 2.6z" fill="#fff"/></svg>In progress</span><span class="zl-status zl-status--done"><svg class="zl-status-dot" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M4.3 7.2 6.2 9l3.6-3.8" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Done</span><span class="zl-status zl-status--canceled"><svg class="zl-status-dot" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M4.9 4.9l4.2 4.2M9.1 4.9 4.9 9.1" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>Canceled</span></div>
<p class="zl-field-hint" style="margin:0">A status property always pairs its glyph with the word. Not started is the default.</p>
</body>
</html>
