<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SidePanel — ZeroLatency DS</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--text)}</style></head>
<body class="zl" style="padding:24px">
<div style="display:flex;gap:24px;align-items:stretch;height:540px">
<aside class="zl-panel" aria-label="Edit view">
  <div class="zl-panel-head"><h3>Edit view</h3><button class="zl-btn zl-btn--icon " aria-label="Close panel"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7l5 5-5 5M5 7l5 5-5 5"/></svg></button></div>
  <div class="zl-panel-name"><span class="zl-icon-tile"><svg class="zl-glyph zl-ink-orange " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm-1.3 5 .4 7h1.8l.4-7zm1.3 8.7a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg></span><input class="zl-input zl-input--lg" value="Needs you" aria-label="View name"></div>
  <div class="zl-panel-label">General</div>
  <button class="zl-panel-row is-hover"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.4"/></svg><span class="zl-panel-row-text">Properties<small>From, Subject, Label, Date, Files</small></span><span class="zl-panel-row-end"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></button>
  <button class="zl-panel-row"><svg class="zl-icon zl-ink-blue" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg><span class="zl-panel-row-text">Filter<small>4 filters</small></span><span class="zl-panel-row-end"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></button>
  <button class="zl-panel-row"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5"/><circle cx="17.5" cy="6.5" r="2.5" fill="currentColor" stroke="none"/></svg><span class="zl-panel-row-text">Hover actions<small>Archive, Trash, Read/unread, Remind, Any label</small></span><span class="zl-panel-row-end"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></button>
  <div class="zl-panel-foot"><button class="zl-btn zl-btn--danger"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>Delete view</button></div>
</aside>
<aside class="zl-panel" aria-label="Properties">
  <div class="zl-panel-head"><button class="zl-btn zl-btn--icon " aria-label="Back"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><h3>Properties</h3><button class="zl-btn zl-btn--icon " aria-label="Close panel"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7l5 5-5 5M5 7l5 5-5 5"/></svg></button></div>
  <div class="zl-panel-label">Shown in view</div>
  <div class="zl-panel-row zl-panel-row--prop"><span class="zl-drag"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="2.4"/></svg></span><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v2.5M12 17.5V20M4 12h2.5M17.5 12H20M6.3 6.3l1.8 1.8M15.9 15.9l1.8 1.8M6.3 17.7l1.8-1.8M15.9 8.1l1.8-1.8"/></svg><span class="zl-panel-row-text">Status</span><span class="zl-panel-row-end"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.2-6 9-6 9 6 9 6-3.2 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></div><div class="zl-panel-row zl-panel-row--prop"><span class="zl-drag"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="2.4"/></svg></span><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 8.5 6 13 18M5.8 14.5h5.4M15.5 12.5c.6-.7 1.4-1 2.3-1 1.4 0 2.2.8 2.2 2.2V18M20 15c-2.8 0-4.5.5-4.5 1.7 0 .9.7 1.4 1.7 1.4 1.5 0 2.8-1.1 2.8-2.6"/></svg><span class="zl-panel-row-text">Subject</span><span class="zl-panel-row-end"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.2-6 9-6 9 6 9 6-3.2 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></div><div class="zl-panel-row zl-panel-row--prop"><span class="zl-drag"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="2.4"/></svg></span><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5V5a1 1 0 0 1 1-1h7.5L20 11.5 12.5 19z"/><circle cx="8.5" cy="8.5" r="1.2"/></svg><span class="zl-panel-row-text">Label</span><span class="zl-panel-row-end"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.2-6 9-6 9 6 9 6-3.2 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></div>
  <div class="zl-panel-label">Hidden in view</div>
  <div class="zl-panel-row zl-panel-row--prop"><span class="zl-drag"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="2.4"/></svg></span><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="10" r="2.8"/><path d="M7 17.5c1-2 2.8-3 5-3s4 1 5 3"/></svg><span class="zl-panel-row-text">From</span><span class="zl-panel-row-end"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M9.9 6.3A9 9 0 0 1 12 6c5.8 0 9 6 9 6a15 15 0 0 1-2.6 3.3M6.4 7.8A15 15 0 0 0 3 12s3.2 6 9 6a8.6 8.6 0 0 0 3.6-.8"/></svg><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></div><div class="zl-panel-row zl-panel-row--prop"><span class="zl-drag"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="2.4"/></svg></span><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 8.5 10 15a2 2 0 0 1-2.8-2.8L14 5.4a3.5 3.5 0 0 1 5 5L12 17.5a5 5 0 0 1-7-7L11.5 4"/></svg><span class="zl-panel-row-text">Files</span><span class="zl-panel-row-end"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M9.9 6.3A9 9 0 0 1 12 6c5.8 0 9 6 9 6a15 15 0 0 1-2.6 3.3M6.4 7.8A15 15 0 0 0 3 12s3.2 6 9 6a8.6 8.6 0 0 0 3.6-.8"/></svg><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></span></div>
  <button class="zl-btn zl-btn--secondary zl-btn--block" style="margin-top:12px">Add property</button>
</aside>
<aside class="zl-panel" aria-label="Add property">
  <div class="zl-panel-head"><button class="zl-btn zl-btn--icon " aria-label="Back"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><h3>Add property</h3><button class="zl-btn zl-btn--icon " aria-label="Close"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div>
  <input class="zl-input zl-input--lg is-focus" placeholder="Add new property" aria-label="Property name" style="margin-bottom:12px">
  <button class="zl-panel-row zl-panel-row--prop"><span class="zl-type-tile"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 8.5 6 13 18M5.8 14.5h5.4M15.5 12.5c.6-.7 1.4-1 2.3-1 1.4 0 2.2.8 2.2 2.2V18M20 15c-2.8 0-4.5.5-4.5 1.7 0 .9.7 1.4 1.7 1.4 1.5 0 2.8-1.1 2.8-2.6"/></svg></span><span class="zl-panel-row-text">Text<small>For summaries and notes</small></span></button><button class="zl-panel-row zl-panel-row--prop"><span class="zl-type-tile"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 7 20M17 4l-2 16M4.5 9h16M3.5 15h16"/></svg></span><span class="zl-panel-row-text">Number<small>For quantities and amounts</small></span></button><button class="zl-panel-row zl-panel-row--prop"><span class="zl-type-tile"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M9 11l3 3 3-3"/></svg></span><span class="zl-panel-row-text">Select<small>Choose one option</small></span></button><button class="zl-panel-row zl-panel-row--prop"><span class="zl-type-tile"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5V5a1 1 0 0 1 1-1h7.5L20 11.5 12.5 19z"/><circle cx="8.5" cy="8.5" r="1.2"/></svg></span><span class="zl-panel-row-text">Multi-select<small>Choose one or more options</small></span></button><button class="zl-panel-row zl-panel-row--prop is-hover"><span class="zl-type-tile"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v2.5M12 17.5V20M4 12h2.5M17.5 12H20M6.3 6.3l1.8 1.8M15.9 15.9l1.8 1.8M6.3 17.7l1.8-1.8M15.9 8.1l1.8-1.8"/></svg></span><span class="zl-panel-row-text">Status<small>For tracking progress</small></span><span class="zl-panel-row-end"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button><button class="zl-panel-row zl-panel-row--prop"><span class="zl-type-tile"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v3M15.5 3.5v3"/></svg></span><span class="zl-panel-row-text">Date<small>Accepts a date</small></span></button><button class="zl-panel-row zl-panel-row--prop"><span class="zl-type-tile"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="10" r="2.8"/><path d="M7 17.5c1-2 2.8-3 5-3s4 1 5 3"/></svg></span><span class="zl-panel-row-text">Person<small>Tag anyone in your workspace</small></span></button>
</aside>
</div>
</body>
</html>
