<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Card — ZeroLatency DS</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--text)}</style></head>
<body class="zl" style="padding:24px">
<div class="zl-features">
  <article class="zl-card"><span class="zl-card-icon"><svg class="zl-glyph zl-ink-yellow " viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4 13.5h6.5L9.5 22 20 9.5h-6.8z"/></svg></span><h3>Auto labels</h3><p>Describe a label in plain words; new mail is sorted as it lands.</p></article>
  <article class="zl-card zl-card--interactive" tabindex="0"><span class="zl-card-icon"><svg class="zl-glyph zl-ink-purple " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 2 7.5 12 13l10-5.5zM4.3 11.2 2 12.5 12 18l10-5.5-2.3-1.3L12 15.4zm0 5L2 17.5 12 23l10-5.5-2.3-1.3L12 20.4z"/></svg></span><h3>Views you define</h3><p>Filter, group and choose properties. Every view is a saved question.</p></article>
  <article class="zl-card"><span class="zl-card-icon"><svg class="zl-glyph zl-ink-orange " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zm-2 7v10h14V9z"/></svg></span><h3>Scheduling built in</h3><p>Offer times from your calendar without leaving the reply.</p></article>
</div>
