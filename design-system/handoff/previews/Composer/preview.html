<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Composer — ZeroLatency DS</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--text)}</style></head>
<body class="zl" style="padding:24px">
<div class="zl-composer" role="dialog" aria-label="New message">
  <div class="zl-composer-head"><span>Alex Morgan<small>alex@northwind.io</small></span><button class="zl-btn zl-btn--icon zl-btn--sm" aria-label="Minimize"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button><button class="zl-btn zl-btn--icon zl-btn--sm" aria-label="Close"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div>
  <div class="zl-composer-line"><span class="zl-recipient">priya@raman.co<button aria-label="Remove priya@raman.co"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button></span><input aria-label="Add recipient" placeholder=""><button class="zl-btn zl-btn--text zl-btn--sm">Cc/Bcc</button></div>
  <div class="zl-composer-line"><input aria-label="Subject" value="Re: Term sheet redlines"></div>
  <div class="zl-composer-body" contenteditable="true" aria-label="Message body">Thanks Priya — Thursday works. I’ll go through both points tonight.</div>
  <div class="zl-composer-foot"><span class="zl-split"><button class="zl-btn zl-btn--primary">Send</button><button class="zl-btn zl-btn--primary" aria-label="Schedule send"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button></span><small>Draft saved</small><button class="zl-btn zl-btn--icon " aria-label="Discard draft"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button></div>
</div>
</body>
</html>
