<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>OptionList — ZeroLatency DS</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--text)}</style></head>
<body class="zl" style="padding:24px">
<div style="max-width:320px">
  <h2 style="margin:0 0 4px;font-size:var(--text-md);font-weight:600">Let’s start fresh. What would you like in your primary inbox?</h2>

  <div class="zl-options"><button class="zl-option" aria-pressed="true"><svg class="zl-glyph zl-ink-orange " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zm-2 7v10h14V9z"/></svg>Calendar<span class="zl-tag zl-tag--accent">Included</span></button><button class="zl-option" aria-pressed="true"><svg class="zl-glyph zl-ink-purple " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a6 6 0 0 1 6 6v5l2 3v1H4v-1l2-3V8a6 6 0 0 1 6-6zm-2.5 17h5a2.5 2.5 0 0 1-5 0z"/></svg>Notifications<span class="zl-tag zl-tag--accent">Included</span></button><button class="zl-option" aria-pressed="true"><svg class="zl-glyph zl-ink-pink " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h3v3H4zm5 0h11v3H9zM4 10.5h3v3H4zm5 0h11v3H9zM4 16h3v3H4zm5 0h11v3H9z"/></svg>Mailing lists<span class="zl-tag zl-tag--accent">Included</span></button><button class="zl-option" aria-pressed="false"><svg class="zl-glyph zl-ink-blue " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z"/></svg>Social<span class="zl-tag">Excluded</span></button><button class="zl-option" aria-pressed="false"><svg class="zl-glyph zl-ink-green " viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 3.5 6.4 9H3v2l1.8 8.2A1 1 0 0 0 5.8 20h12.4a1 1 0 0 0 1-.8L21 11V9h-3.4l-2.8-5.5-1.8.9L15.4 9H8.6l2.4-4.6z"/></svg>Promotions<span class="zl-tag">Excluded</span></button></div>
  <button class="zl-btn zl-btn--primary zl-btn--block" style="margin-top:20px">Continue</button>
</div>
