<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — ZeroLatency DS</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--text)}</style></head>
<body class="zl" style="padding:24px">
<p class="zl-section-label" style="margin:0 0 8px">Variants</p>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px"><button class="zl-btn zl-btn--primary">Continue</button><button class="zl-btn zl-btn--secondary"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 15 9M14 5v2M18 9h2M17 6l1.5-1.5M18.5 13.5 17 12M10 6 8.5 4.5"/></svg>Auto label</button><button class="zl-btn zl-btn--ghost">Cancel</button><button class="zl-btn zl-btn--text">Reset</button><button class="zl-btn zl-btn--danger"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>Delete view</button></div>
<p class="zl-section-label" style="margin:0 0 8px">Split, icon and sizes</p>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px"><span class="zl-split"><button class="zl-btn zl-btn--primary">Send</button><button class="zl-btn zl-btn--primary" aria-label="More send options"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button></span><span class="zl-split"><button class="zl-btn zl-btn--primary">Save</button><button class="zl-btn zl-btn--primary" aria-label="More save options"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button></span><button class="zl-btn zl-btn--icon is-on" aria-pressed="true" aria-label="Filter"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button><button class="zl-btn zl-btn--icon " aria-label="Group by"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.4"/></svg></button><button class="zl-btn zl-btn--icon " aria-label="Edit view"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6"/></svg></button><button class="zl-btn zl-btn--icon " aria-label="Refresh"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4.5V8h-3.5"/></svg></button><button class="zl-btn zl-btn--primary zl-btn--sm">Small</button><button class="zl-btn zl-btn--primary zl-btn--lg">Large</button><button class="zl-btn zl-btn--primary zl-btn--xl">Get started</button></div>
<p class="zl-section-label" style="margin:0 0 8px">States: hover · pressed · focus · busy · disabled</p>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px"><button class="zl-btn zl-btn--primary is-hover">Save</button><button class="zl-btn zl-btn--primary is-active">Save</button><button class="zl-btn zl-btn--secondary is-focus"><svg class="zl-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 15 9M14 5v2M18 9h2M17 6l1.5-1.5M18.5 13.5 17 12M10 6 8.5 4.5"/></svg>Auto label</button><button class="zl-btn zl-btn--primary" aria-busy="true"><span class="zl-spinner" aria-hidden="true"></span>Sending</button><button class="zl-btn zl-btn--primary" disabled>Save</button><button class="zl-btn zl-btn--ghost is-hover">Hover</button></div>
</body>
</html>
